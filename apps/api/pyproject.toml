[project]
name = "music-cloud-server"
version = "0.1.0"
description = "Own private music streaming service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.93",
    "bullmq[postgres]>=3.2.2",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "rapidfuzz>=3.14.6",
    "sqlmodel>=0.0.42",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.fastapi]
entrypoint = "app.main:app"
